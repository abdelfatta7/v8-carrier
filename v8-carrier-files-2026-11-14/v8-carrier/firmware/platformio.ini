; V8 carrier robot firmware. Two environments:
;   esp32-s3-devkitc-1  the robot (pio run -e esp32-s3-devkitc-1 -t upload)
;   native              the host-side unit tests (pio test -e native)
; The host tests also build with plain CMake (see CMakeLists.txt), which is
; what CI without PlatformIO runs.
;
; The hardware env uses the pioarduino fork of the espressif32 platform to get
; Arduino-ESP32 core 3.x (IDF 5). The official `espressif32` platform (core
; 2.0.x) also compiles this code: the LEDC calls are version-guarded and the
; I2S driver is the legacy API that exists in both. To use it, replace the
; `platform =` line with `platform = espressif32`.

[platformio]
default_envs = esp32-s3-devkitc-1
test_dir = test

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    ; -D IMU_DRIVER_MPU6050   ; uncomment to use the MPU-6050 driver instead of the BNO085
build_unflags = -std=gnu++11
lib_deps =
    adafruit/Adafruit BNO08x @ ^1.2.5
    adafruit/Adafruit BusIO @ ^1.16.1
; The Pi link is on UART1 (pins.h); the USB port is only the debug console.

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
test_framework = custom
; Each test/test_<module>/ directory is one test executable with its own
; main() from test/minitest.h, which prints Unity-style result lines.
test_build_src = no
